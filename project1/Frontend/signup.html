<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <title>Sign Up</title>
</head>
<body>
    <main>
        <h1>Create Account</h1>

        <form id="signup-form">
            <label for="username">Username:</label>
            <input id="username" maxlength="50" required>

            <label for="password">Password:</label>
            <input id="password" type="password" minlength="8" required>

            <label for="firstname">First Name:</label>
            <input id="firstname" maxlength="50" required>

            <label for="lastname">Last Name:</label>
            <input id="lastname" maxlength="50" required>

            <label for="salary">Salary:</label>
            <input id="salary" type="number" min="0" step="0.01" required>

            <label for="age">Age:</label>
            <input id="age" type="number" min="0" max="150" required>

            <button type="submit">Create Account</button>
        </form>

        <p id="signup-message" role="status"></p>
        <p>Already have an account? <a href="/">Sign In</a></p>
    </main>

    <script src="signup.js"></script>
</body>
</html>
